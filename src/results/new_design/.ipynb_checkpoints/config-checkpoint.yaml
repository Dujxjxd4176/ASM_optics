# config.yaml
# all units in μm
simulation:
  λ: 658e-3   # 532e-3 μm = 532 nm
  resolution: [2**11, 2**11, 1000] #Nx, Ny, Nz
  # simulation range (in micron) (aperture file will be fitted to this xy range)
  range: [-1024, 1024, -1024, 1024, 30000,40000 ] # x_start, x_end, y_start, y_end, z_start, z_end
  z_batch_size: 1
  num_process: 6 # number of parallel computing workers
save:
  # simulation range that are saved (in micron)
  range: [-512, 512, -512, 512] # x_start, x_end, y_start, y_end range to save (in unit μm)

path:
  E2: ./E2/tmp
  # results: ./results/tmp
  aperture: funny.bmp

plot:
  N_ticks: [8, 8, 8]


